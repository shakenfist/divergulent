name: CodeQL

permissions: {}

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 17 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, static]
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # languages: is stated rather than auto-detected. Auto-detection
      # follows GitHub's language statistics, so a directory of shell or
      # JavaScript growing past the Python would silently change what is
      # analysed without anyone deciding to.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      # Deliberately no autobuild step. CodeQL does not need a build for an
      # interpreted language, and the template's autobuild would install this
      # project's dependencies -- running pyproject hooks and a pip resolve
      # authored by the pull request branch -- on a persistent, non-ephemeral
      # self-hosted runner. That is execution surface bought for nothing.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
