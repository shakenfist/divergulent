# Repository secret scanning, as required by the secret-handling audit.
#
# A workflow of its own rather than a job in unit-tests.yml for two
# reasons. It needs a trigger set that workflow does not have -- the audit
# asks for pull requests *and* pushes to the default branch, because a
# secret that reaches develop without a pull request still needs finding.
# And it is a content scanner: its whole point is to read the
# human-written text a path filter would skip, since a credential lands in
# docs/ or a plan as easily as in a script. This project publishes a lot
# of prose, and the one leaked secret in Shaken Fist's own history was
# published in the user guide.
#
# Reference invocation: shakenfist/development/audits/secret-handling.md
name: Secret scan

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  # gitleaks-action@v2 refuses to run on organization repositories
  # without a paid licence, so the upstream binary is invoked directly.
  # gitleaks is only packaged from Debian 13 (trixie) onward -- bookworm
  # has no package -- so this job needs a debian-13 runner.
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, debian-13, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 matters. A secret committed and then reverted is
      # still in the history and still needs rotating; a shallow clone
      # reports a clean history it never looked at.
      - name: Checkout the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # The scan itself, its --log-opts="HEAD" scoping and its positive
      # control all live in the script, so `tools/gitleaks-scan.sh` run
      # locally is the same scan this job runs. The positive control is
      # the part worth knowing about: a scan that finds nothing is
      # indistinguishable from a scan that cannot find anything, so the
      # script plants a private key and fails the build if gitleaks does
      # not report it.
      - name: Run gitleaks
        run: tools/gitleaks-scan.sh
