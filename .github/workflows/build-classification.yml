name: Build classification

permissions:
  contents: read

# Builds the patch-classification bundle from the committed ledger JSONL export,
# signs it, and (when asked) publishes it to the rolling 'classification'
# prerelease so clients can pull it. Unlike the divergence cache this needs no
# archive access -- the ledger export is the source of truth, so this job only
# imports that text file and projects it to the lean signed bundle.
#
# The export lives in the separate, public data repo shakenfist/divergulent-reviews
# (its commit diff is the operator's reviewable publish gate). Being public, the
# checkout needs no token -- the default github.token clones it. Override the repo
# with the LEDGER_REPO variable (and add a LEDGER_REPO_TOKEN secret if you point it
# at a private repo).
#
# Runs daily like the divergence cache, and a scheduled run PUBLISHES: the
# human-in-the-loop gate is the export -> commit -> push into the data repo, so
# this job only ever projects what that gate already approved -- automating the
# mechanics does not weaken the gate. (Measured cost of leaving it manual: the
# published bundle went three weeks stale while 23 approved exports queued
# behind a dispatch nobody sent.) A manual dispatch still defaults to a
# build-only dry run unless `publish` is set.
on:
  schedule:
    - cron: '31 4 * * *'    # daily (staggered off the hour and the cache build)
  workflow_dispatch:
    inputs:
      release:
        description: Debian release codename the bundle describes
        default: trixie
      ledger_path:
        description: Path to the sharded ledger export directory within the data repo
        default: ledger
      publish:
        description: Publish the bundle to the rolling 'classification' release
        type: boolean
        default: false

jobs:
  build:
    runs-on: [self-hosted, static]

    permissions:
      contents: write  # publish the bundle to the 'classification' release
      id-token: write  # keyless Sigstore signing of the bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools_scm needs full history

      - name: Checkout ledger data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.LEDGER_REPO || 'shakenfist/divergulent-reviews' }}
          token: ${{ secrets.LEDGER_REPO_TOKEN || github.token }}
          path: ledger-data

      - name: Build classification bundle
        env:
          # Scheduled runs carry no inputs; fall back to the dispatch defaults.
          RELEASE: ${{ github.event.inputs.release || 'trixie' }}
          LEDGER_PATH: ${{ github.event.inputs.ledger_path || 'ledger' }}
        run: >-
          tools/build-classification.sh
          "classification-bundle/classification-${RELEASE}.json.gz"
          "ledger-data/${LEDGER_PATH}"
          "${RELEASE}"

      - name: Sign classification bundle
        env:
          RELEASE: ${{ github.event.inputs.release || 'trixie' }}
        run: >-
          tools/sign-bundle.sh
          "classification-bundle/classification-${RELEASE}.json.gz"

      - name: Upload classification bundle
        uses: actions/upload-artifact@v7
        with:
          name: classification-bundle
          path: classification-bundle/

      - name: Publish classification bundle
        if: github.event_name == 'schedule' || github.event.inputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.event.inputs.release || 'trixie' }}
        run: >-
          tools/publish-classification.sh
          "classification-bundle/classification-${RELEASE}.json.gz"
